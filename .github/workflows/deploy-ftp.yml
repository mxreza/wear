# Builds the static site and uploads the `out/` folder to the host over FTP.
# The live site is on Vercel (https://wear-gilt.vercel.app), which deploys every push to main by itself.
# This FTP workflow is MANUAL ONLY (Actions tab → "Run workflow") until FTP secrets are set.
# To make it run on every push again, add back:  push: { branches: [main] }  under `on:`.
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER     e.g. ftp.example.ir   (host only, no ftp://)
#              FTP_USERNAME
#              FTP_PASSWORD
#   Variables (optional):
#              FTP_SERVER_DIR target folder on the host, must end with "/" (default: public_html/)
#              FTP_PROTOCOL   ftp | ftps (default: ftp)
#              FTP_PORT       default: 21
name: Deploy to host (FTP)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload to host
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Only changed files are uploaded; sync state is kept on the server in
          # .ftp-deploy-sync-state.json — don't delete that file.
          dangerous-clean-slate: false
